<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Daily Log</h1>
    <p class="subtitle">Track your study sessions.</p>
  </header>

  <main>
      <section id="subjects-section">
          ...
      </section>

      <section id="sessions-section">
          ...
      </section>

      <section id="habits-section">
          <h2>Today's Habits</h2>
          <div id="habits-list" class="list"></div>
          <form id="habit-form">
              <input name="name" placeholder="Habit name" required>
              <input name="icon" placeholder="Icon (emoji or text)" maxlength="4">
              <button type="submit">Add</button>
          </form>
      </section>

      <section id="summary-section">
          ...
      </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
