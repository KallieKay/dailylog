<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Daily Log</h1>
    <p class="subtitle">Track your study sessions.</p>
  </header>

  <main>
    <section id="subjects-section">
      <h2>Subjects</h2>
      <div id="subjects-list" class="list"></div>
      <form id="subject-form">
        <input name="name" placeholder="Subject name" required>
        <input name="goal_hours_per_week" type="number" step="0.5" min="0" placeholder="Goal hrs/week">
        <button type="submit">Add</button>
      </form>
    </section>

    <section id="sessions-section">
      <h2>Today's Sessions</h2>
      <div id="sessions-list" class="list"></div>
      <form id="session-form">
        <select name="subject_id" required></select>
        <input name="duration_min" type="number" min="1" max="1440" placeholder="Minutes" required>
        <input name="notes" placeholder="Notes (optional)">
        <button type="submit">Log</button>
      </form>
    </section>

    <section id="summary-section">
      <h2>This Week</h2>
      <div id="summary"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
