name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
      - name: Decode OIDC token (debug)
        run: |
          echo "Requesting OIDC token..."
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "JWT payload:"
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build Lambda packages
        run: |
          cd backend
          pip install --upgrade pip
          bash build.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Terraform init
        run: terraform init
        working-directory: terraform

      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_VAR_report_sender: ${{ vars.REPORT_SENDER }}
          TF_VAR_report_recipient: ${{ vars.REPORT_RECIPIENT }}

      - name: Deploy frontend to S3
        run: |
          cd frontend
          API_URL=$(cd ../terraform && terraform output -raw api_url)
          FRONTEND_URL=$(cd ../terraform && terraform output -raw frontend_url)
          DIST_ID=$(cd ../terraform && terraform output -raw frontend_distribution_id)

          BUILD=../build/frontend
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          cp index.html "$BUILD/index.html"
          cp styles.css "$BUILD/styles.css"
          API_URL_CLEAN="${API_URL%/}"
          sed "s|%%API_URL%%|${API_URL_CLEAN}|g" app.js > "$BUILD/app.js"

          aws s3 sync "$BUILD" "s3://${{ vars.FRONTEND_BUCKET }}/" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=300"

          aws s3 sync "$BUILD" "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --exclude "*" --include "*.css" --include "*.js" \
            --cache-control "public, max-age=31536000, immutable"

          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" > /dev/null
          echo "Deployed frontend: $FRONTEND_URL"

      - name: Smoke test
        run: |
          URL=$(cd terraform && terraform output -raw api_url)
          echo "Testing $URL/health"
          curl -fsS "$URL/health"