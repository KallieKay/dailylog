name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build both Lambda packages
        run: |
          cd backend
          pip install --upgrade pip
          bash build.sh

      - name: Verify API package
        run: |
          test -f build/lambda/handler.py
          test -f build/lambda/app/main.py
          ls -la build/lambda/pydantic_core/ | grep linux || (echo "missing linux wheel" && exit 1)

      - name: Verify report package
        run: |
          test -f build/report/handler.py
          test -f build/report/app.py

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-api
          path: build/lambda/
          retention-days: 7

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-report
          path: build/report/
          retention-days: 7